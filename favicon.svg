<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="prakruti-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d3e" />
      <stop offset="50%" stop-color="#2e7d60" />
      <stop offset="100%" stop-color="#0f382c" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f382c" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#prakruti-grad)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#gold-grad)" stroke-width="6" opacity="0.8"/>

  <!-- Leaf Shape Background -->
  <path d="M256,60 C360,60 420,150 420,256 C420,360 330,440 256,440 C182,440 92,360 92,256 C92,150 152,60 256,60 Z" fill="rgba(255,255,255,0.08)"/>

  <!-- Medical Cross with Organic Rounded Ends -->
  <g fill="url(#gold-grad)">
    <rect x="226" y="126" width="60" height="260" rx="30"/>
    <rect x="126" y="226" width="260" height="60" rx="30"/>
  </g>

  <!-- Central Healing Leaf Icon -->
  <path d="M256,150 C290,190 320,240 256,340 C192,240 222,190 256,150 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M256,170 Q256,250 286,300" fill="none" stroke="#1b4d3e" stroke-width="4" stroke-linecap="round"/>
</svg>
